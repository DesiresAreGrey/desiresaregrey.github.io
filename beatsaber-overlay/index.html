<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Overlay</title>
		<link rel="stylesheet" href="/stylesheets/misc/beatsaber-overlay/style.css">
		<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300..700&display=swap" rel="stylesheet">
	</head>
	
	<body>
		<div id="overlay" class="hidden">
			<div id="performance">
				<div class="performance-group">
					<span class="text" id="rank">E</span>
					<span class="subtext" id="percentage">0%</span>
				</div>

				<div class="performance-group">
					<span class="text" id="combo">0</span>
					<span class="subtext" id="combotext">Combo</span>
				</div>
				
				<span id="score">0</span>
			</div>

			<div id="beatmap">
				<div id="cover">
					<img id="image" src="/assets/DesiresAreGrey.png">
					
					<svg width="90" height="90">
						<circle cx="45" cy="45" r="35" id="remaining"></circle>
						<circle cx="45" cy="45" r="35" id="progress"></circle>
					</svg>

					<div>
						<span id="progress-text">0:00</span>
					</div>
				</div>

				<div id="meta">
					<div id="text">
						<div id="titles">
							<span id="title">Title</span>
							<span id="subtitle">Subtitle</span>
						</div>

						<span id="artist">Artist</span>
					</div>
					
					<div id="difficulty-info">
						<span id="difficulty">Easy</span>
						<span id="bpm">0 BPM</span>
						<span id="njs">0 NJS</span>
					</div>
				</div>
			</div>
		</div>
		<script src="/js/misc/beatsaber-overlay/options.js"></script>
		
		<script src="/js/misc/beatsaber-overlay/ui.js"></script>
		<script src="/js/misc/beatsaber-overlay/events.js"></script>
		<script src="/js/misc/beatsaber-overlay/manager.js"></script>
		<script>
			if (query.has('test')) ui.show();
		</script>
	</body>
</html>
