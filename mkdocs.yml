site_name: DesiresAreGrey
site_description: "DesiresAreGrey's Website"
site_url: https://desiresaregrey.com/
theme:
  variant: classic
  logo: assets/DesiresAreGrey-Circle.png
  favicon: assets/DesiresAreGrey-Circle.png
  palette:
    scheme: slate
    primary: deep purple
    accent: indigo
  font:
    text: Inter
  features:
    - navigation.tabs
    - navigation.tabs.sticky
  custom_dir: overrides
  icon:
    admonition:
      note: lucide/paperclip
      abstract: lucide/notebook-text
      info: lucide/info
      tip: lucide/flame
      success: lucide/check
      question: lucide/circle-question-mark
      warning: lucide/triangle-alert
      failure: lucide/octagon-alert
      danger: lucide/zap
      bug: lucide/bug
      example: lucide/flask-conical
      quote: lucide/message-square-quote
markdown_extensions:
  - attr_list
  - md_in_html
  - meta
  - admonition
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - zensical.extensions.glightbox:
      width: "100%"
      height: auto
      skip_classes:
        - no-lb
      auto_caption: false
      caption_position: bottom
extra:
  generator: false
  analytics:
    provider: google 
    property: G-67EDVX3WRV 
  social:
    - icon: fontawesome/brands/reddit-alien
      link: https://www.reddit.com/user/DesiresAreGrey
      name: Reddit
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/DesiresAreGrey
      name: Twitter
extra_css:
  - stylesheets/extra.css
  - stylesheets/zensical-ports.css

